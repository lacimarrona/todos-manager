name: TechCheck v2 CI

on:
  push:
    branches: [main]
    paths: ['techcheck-v2/**']
  pull_request:
    paths: ['techcheck-v2/**']

concurrency:
  group: techcheck-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techcheck-v2/backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: techcheck_test
          MYSQL_USER: techcheck_user
          MYSQL_PASSWORD: techcheck_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: techcheck_test
      DB_USER: techcheck_user
      DB_PASSWORD: techcheck_pass
      JWT_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: techcheck-v2/backend/package-lock.json
      - run: npm ci
      - run: npx sequelize-cli db:migrate --env test
      - run: npm test

  frontend-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techcheck-v2/frontend-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: techcheck-v2/frontend-web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: techcheck-v2/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: techcheck-v2/mobile/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test
