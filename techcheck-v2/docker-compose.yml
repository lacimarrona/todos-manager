version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: techcheck-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: techcheck-backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:${PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - ./backend/seeders:/app/seeders
      - ./backend/.sequelizerc:/app/.sequelizerc
      - ./backend/tests:/app/tests
      - ./backend/vitest.config.js:/app/vitest.config.js
      # .env.test se copia vía docker cp (ver README para tests)

  frontend:
    build: ./frontend-web
    container_name: techcheck-frontend
    restart: unless-stopped
    ports:
      - "0.0.0.0:${APP_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
