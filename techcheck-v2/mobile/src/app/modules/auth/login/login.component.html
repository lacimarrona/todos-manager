<ion-content class="login-page">
  <div class="login-wrapper">
    <ion-card class="login-card">
      <ion-card-header>
        <div class="login-logo">
          <ion-icon name="lock-closed-outline" size="large"></ion-icon>
        </div>
        <ion-card-title>TechCheck</ion-card-title>
        <p class="login-subtitle">Plataforma de Mantenimiento</p>
        @if (!online()) {
          <p class="login-offline-badge">
            <ion-icon name="cloud-offline-outline"></ion-icon> Sin conexión — acceso local
          </p>
        }
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="form" (ngSubmit)="submit()">
          <ion-item>
            <ion-icon name="mail-outline" slot="start"></ion-icon>
            <ion-label position="floating">Correo electrónico</ion-label>
            <ion-input
              type="email"
              formControlName="email"
              autocomplete="email"
              inputmode="email">
            </ion-input>
          </ion-item>

          <ion-item class="ion-margin-top">
            <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
            <ion-label position="floating">Contraseña</ion-label>
            <ion-input
              type="password"
              formControlName="password"
              autocomplete="current-password">
              <ion-input-password-toggle slot="end"></ion-input-password-toggle>
            </ion-input>
          </ion-item>

          @if (error()) {
            <ion-text color="danger">
              <p class="login-error">{{ error() }}</p>
            </ion-text>
          }

          <ion-button
            expand="block"
            type="submit"
            class="ion-margin-top"
            [disabled]="form.invalid || loading()">
            @if (loading()) {
              <ion-spinner name="crescent"></ion-spinner>
            } @else {
              Ingresar
            }
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
