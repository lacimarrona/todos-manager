<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEdit ? 'Editar' : 'Nuevo' }} Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="full" class="form-list">
      <ion-item>
        <ion-input
          label="Nombre completo *"
          labelPlacement="stacked"
          formControlName="nombre"
          placeholder="Nombre del usuario"
          autocomplete="name">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          label="Email *"
          labelPlacement="stacked"
          type="email"
          formControlName="email"
          placeholder="correo@empresa.com"
          autocomplete="email"
          inputmode="email">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-input
          [label]="isEdit ? 'Nueva contraseña (dejar vacío para no cambiar)' : 'Contraseña *'"
          labelPlacement="stacked"
          type="password"
          formControlName="password"
          placeholder="Mínimo 6 caracteres"
          autocomplete="new-password">
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-select
          label="Rol *"
          labelPlacement="stacked"
          formControlName="rol"
          interface="popover">
          <ion-select-option value="usuario">Usuario</ion-select-option>
          <ion-select-option value="admin">Admin</ion-select-option>
        </ion-select>
      </ion-item>

      @if (isEdit) {
        <ion-item>
          <ion-label>Activo</ion-label>
          <ion-toggle formControlName="activo" slot="end"></ion-toggle>
        </ion-item>
      }
    </ion-list>

    @if (error()) {
      <ion-text color="danger">
        <p class="form-error">{{ error() }}</p>
      </ion-text>
    }

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="form.invalid || loading()">
      @if (loading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Guardar
      }
    </ion-button>
  </form>
</ion-content>
