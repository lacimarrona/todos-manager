<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEdit ? 'Editar' : 'Nuevo' }} Usuario</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="full" class="form-list">
    <ion-item>
      <ion-input
        label="Nombre completo *"
        labelPlacement="stacked"
        [value]="nombre()"
        (ionInput)="nombre.set($event.detail.value ?? '')"
        placeholder="Nombre del usuario"
        autocomplete="name">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Email *"
        labelPlacement="stacked"
        type="email"
        [value]="email()"
        (ionInput)="email.set($event.detail.value ?? '')"
        placeholder="correo@empresa.com"
        autocomplete="email"
        inputmode="email">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        [label]="isEdit ? 'Nueva contraseña (dejar vacío para no cambiar)' : 'Contraseña *'"
        labelPlacement="stacked"
        type="password"
        [value]="password()"
        (ionInput)="password.set($event.detail.value ?? '')"
        placeholder="Mínimo 6 caracteres"
        autocomplete="new-password">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-select
        label="Rol *"
        labelPlacement="stacked"
        [value]="rol()"
        (ionChange)="rol.set($event.detail.value)"
        interface="action-sheet">
        <ion-select-option value="usuario">Usuario</ion-select-option>
        <ion-select-option value="admin">Admin</ion-select-option>
      </ion-select>
    </ion-item>

    @if (!isEdit) {
      <ion-item>
        <ion-select
          label="Workspace *"
          labelPlacement="stacked"
          [value]="workspaceId()"
          (ionChange)="workspaceId.set($event.detail.value)"
          interface="action-sheet"
          placeholder="Seleccionar workspace">
          @for (ws of workspaces; track ws.id) {
            <ion-select-option [value]="ws.id">{{ ws.nombre }}</ion-select-option>
          }
        </ion-select>
      </ion-item>
    }
  </ion-list>

  @if (error()) {
    <ion-text color="danger"><p class="form-error">{{ error() }}</p></ion-text>
  }

  <ion-button expand="block" type="button" class="ion-margin-top"
    [disabled]="!isValid() || loading()" (click)="submit()">
    @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else {
      {{ isEdit ? 'Guardar cambios' : 'Crear usuario' }}
    }
  </ion-button>
</ion-content>
