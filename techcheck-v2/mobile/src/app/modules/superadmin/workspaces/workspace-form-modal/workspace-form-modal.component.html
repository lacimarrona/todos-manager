<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEdit ? 'Editar' : 'Nuevo' }} Workspace</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <ion-list lines="full" class="form-list">
      <ion-item>
        <ion-input
          label="Nombre *"
          labelPlacement="stacked"
          formControlName="nombre"
          placeholder="Nombre del workspace"
          autocomplete="off">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-textarea
          label="Descripción"
          labelPlacement="stacked"
          formControlName="descripcion"
          placeholder="(opcional)"
          [rows]="3"
          autoGrow="true">
        </ion-textarea>
      </ion-item>

      @if (isEdit) {
        <ion-item>
          <ion-label>Activo</ion-label>
          <ion-toggle formControlName="activo" slot="end"></ion-toggle>
        </ion-item>
      }
    </ion-list>

    @if (error()) {
      <ion-text color="danger">
        <p class="form-error">{{ error() }}</p>
      </ion-text>
    }

    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="form.invalid || loading()">
      @if (loading()) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        Guardar
      }
    </ion-button>
  </form>
</ion-content>
