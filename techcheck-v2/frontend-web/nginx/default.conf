server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Tamaño máximo de cuerpo (evidencias en base64 pueden ser grandes)
    client_max_body_size 20m;

    # ── Compresión gzip ───────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # ── Cache de assets estáticos ─────────────────────────────────
    location ~* \.(js|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # ── Proxy al backend para todas las rutas /api/ ───────────────
    location /api/ {
        proxy_pass         http://backend:4000;
        proxy_http_version 1.1;
        # Limpiar Upgrade para prevenir H2C smuggling — el backend es REST puro sin WebSockets
        proxy_set_header   Upgrade           "";
        proxy_set_header   Connection        "close";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 20m;
    }

    # ── SPA: todas las demás rutas sirven index.html ──────────────
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri $uri/ /index.html;
    }
}
