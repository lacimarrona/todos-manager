<ion-split-pane contentId="workspace-content" when="md">

  <ion-menu menuId="workspace-menu" contentId="workspace-content">
    <ion-content>

      <!-- Brand -->
      <div class="sb-brand">
        <div class="sb-logo">✓</div>
        <span class="sb-name">TechCheck</span>
      </div>

      <!-- Usuario -->
      <div class="sb-user">
        <div class="sb-user-name">{{ auth.user()?.nombre }}</div>
        <div class="sb-user-role">{{ auth.user()?.rol }}</div>
      </div>

      <!-- Workspace switcher -->
      @if (hasMultiWs()) {
        <div class="sb-section">
          <p class="sb-section-label">
            <ion-icon name="swap-horizontal-outline"></ion-icon>
            Workspace
          </p>
          @for (ws of workspaces(); track ws.id) {
            <button class="sb-ws-btn" [class.sb-ws-btn--active]="ws.id === activeWsId()" (click)="switchWorkspace(ws.id)">
              {{ ws.nombre }}
              @if (ws.id === activeWsId()) {
                <ion-icon name="checkmark-circle-outline" class="sb-ws-check"></ion-icon>
              }
            </button>
          }
        </div>
      }

      <!-- Navegación principal -->
      <nav class="sb-nav">
        @for (item of navItems; track item.path) {
          @if (!item.adminOnly || auth.isAdmin()) {
            <a [routerLink]="item.path"
               routerLinkActive="sb-item--active"
               class="sb-item"
               (click)="closeMenu()">
              <ion-icon [name]="item.icon" class="sb-item-icon"></ion-icon>
              <span>{{ item.label }}</span>
            </a>
          }
        }
      </nav>

      <!-- Pie -->
      <div class="sb-footer">
        <button class="sb-footer-btn" (click)="openSessions()">
          <ion-icon name="phone-portrait-outline"></ion-icon>
          Sesiones activas
        </button>
        <button class="sb-footer-btn" (click)="openChangePassword()">
          <ion-icon name="key-outline"></ion-icon>
          Cambiar contraseña
        </button>
        <button class="sb-footer-btn sb-footer-btn--danger" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
          Cerrar sesión
        </button>
        <div class="sb-version">v2.0</div>
      </div>

    </ion-content>
  </ion-menu>

  <ion-router-outlet id="workspace-content"></ion-router-outlet>

</ion-split-pane>
