<ion-header>
  <ion-toolbar>
    <ion-title>{{ isEdit ? 'Editar' : 'Nuevo' }} Proyecto</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()" fill="clear">Cancelar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list lines="full" class="form-list">
    <ion-item>
      <ion-input
        label="Nombre *"
        labelPlacement="stacked"
        [value]="nombre()"
        (ionInput)="nombre.set($event.detail.value ?? '')"
        placeholder="Nombre del proyecto"
        autocomplete="off">
      </ion-input>
    </ion-item>
    <ion-item>
      <ion-textarea
        label="Descripción"
        labelPlacement="stacked"
        [value]="descripcion()"
        (ionInput)="descripcion.set($event.detail.value ?? '')"
        placeholder="(opcional)"
        [rows]="3"
        autoGrow="true">
      </ion-textarea>
    </ion-item>
  </ion-list>

  @if (error()) {
    <ion-text color="danger"><p class="form-error">{{ error() }}</p></ion-text>
  }

  <ion-button expand="block" type="button" class="ion-margin-top"
    [disabled]="!isValid() || loading()" (click)="submit()">
    @if (loading()) { <ion-spinner name="crescent"></ion-spinner> } @else { Guardar }
  </ion-button>
</ion-content>
