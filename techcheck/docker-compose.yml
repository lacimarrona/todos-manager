services:
  techcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techcheck
    restart: unless-stopped
    ports:
      - "3010:3010"
    volumes:
      - ./data:/app/backend/data
    environment:
      - PORT=3010
      - NODE_ENV=production
      - DATA_SOURCE=json
      - APP_NAME=TechCheck
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s