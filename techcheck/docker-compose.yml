services:
  techcheck:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: techcheck
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    volumes:
      - ./data:/app/backend/data
    environment:
      - PORT=${PORT:-3010}
      - NODE_ENV=production
      - DATA_SOURCE=json
      - APP_NAME=TechCheck
      - APP_VERSION=1.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3010}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s