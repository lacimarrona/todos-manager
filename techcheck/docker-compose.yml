services:
  techcheck:
    build:
      context: .
      dockerfile: Dockerfile
    image: julianquintero/techcheck:1.5.4
    container_name: techcheck
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    volumes:
      # Volumen nombrado: Docker lo conserva entre actualizaciones de imagen.
      # Los datos (SQLite + archivos adjuntos) sobreviven a 'docker compose up --pull'.
      - techcheck_data:/app/backend/data
    environment:
      - PORT=${PORT:-3010}
      - NODE_ENV=production
      - DATA_SOURCE=sqlite
      - APP_NAME=TechCheck
      - APP_VERSION=1.5.4
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3010}/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  techcheck_data:
    name: techcheck_data
